version: '3.8'
services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile-auth
    ports:
      - "8081:8080"
    volumes:
      - ./src/main/resources/auth:/app/src/main/resources
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/src/main/resources/data-auth.mv.db
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD:
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

  order-service:
    build:
      context: .
      dockerfile: Dockerfile-order
    ports:
      - "8082:8080"
    volumes:
      - ./src/main/resources/order:/app/src/main/resources
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/src/main/resources/data-order.mv.db
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD:
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
